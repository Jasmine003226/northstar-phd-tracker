name: Update verified PhD vacancies and deploy
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and validate vacancies
        run: python scripts/update_jobs.py
      - name: Save updated vacancy data
        run: |
          git config user.name "northstar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data/search-log.json
          git diff --cached --quiet || git commit -m "chore: update verified PhD vacancies"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
